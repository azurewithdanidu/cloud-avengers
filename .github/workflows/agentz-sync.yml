# Publishes this plugin to the agentz marketplace. Added by the agentz onboarding plugin (/init).
# When the plugin version changes on the default branch, this copies plugin.json and README.md
# into the marketplace and opens (or updates) a draft pull request pinned to this commit.
# Nothing in this repo is changed. Needs the AGENTZ_MARKETPLACE_TOKEN secret: a fine-grained token
# with Contents and Pull requests read and write on azurewithdanidu/agentz.
name: agentz-sync

on:
  push:
    paths:
      - "plugin.json"
      - ".claude-plugin/plugin.json"
      - ".github/workflows/agentz-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentz-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Check out marketplace
        uses: actions/checkout@v4
        with:
          repository: azurewithdanidu/agentz
          ref: main
          token: ${{ secrets.AGENTZ_MARKETPLACE_TOKEN }}
          path: marketplace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Open or update the marketplace pull request
        env:
          GH_TOKEN: ${{ secrets.AGENTZ_MARKETPLACE_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          OWNER_EMAIL: "122934950+azurewithdanidu@users.noreply.github.com"
        run: |
          python marketplace/plugins/onboarding/skills/sync-marketplace/scripts/sync.py \
            --source source --plugin-path "." --marketplace marketplace \
            --source-repository "$SOURCE_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --category "development" --owner-handle "@azurewithdanidu" \
            --base-branch "main" ${OWNER_EMAIL:+--owner-email "$OWNER_EMAIL"} --publish
